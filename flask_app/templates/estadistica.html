<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Estadísticas</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/estadistica.css') }}">
    </head>
    <body>
        <h1>Estadísticas</h1>
        <div class="fotitos">
            <fieldset>
                <legend>Cantidad de actividades por día de semana</legend>
                <div id="grafico-lineas" style="width: 100%; height: 400px;"></div>
            </fieldset>
            <fieldset>
                <legend>Cantidad de actividades por tipo</legend>
                <div id="grafico-torta" style="width: 100%; height: 400px;"></div>
            </fieldset>
            <fieldset>
                <legend>Cantidad de actividades en cierto horario por cada mes del año</legend>
                <div id="grafico-barras" style="width: 100%; height: 400px;"></div>
            </fieldset>
        </div>
        <div class="boton-container">
            <button type="button" id="btn-portada">Volver a Inicio</button>
        </div>


        <script src="https://code.highcharts.com/highcharts.js"></script>
        <script src="https://code.highcharts.com/modules/accessibility.js"></script>
        <script src="{{ url_for('static', filename='js/estadistica.js') }}"></script>


    </body>




</html>
