<!DOCTYPE html>
<html lang="es">
<head>
    <title>Informa tu actividad</title>
    <link rel="stylesheet" href="../css/informa-act.css">
</head>
<body>
    <h1>Informa una actividad</h1>
    <div class="main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>

        <form class="formulario" id="info-act-form" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>¿Dónde?</legend>
                <div class="grupo-input">
                    <label for="region">Seleccione una región</label>
                    <select id="region" name="region" required >
                        <option value="">--Selecciona Región--</option>
                    </select>
                </div>
                <br>
                <div class="grupo-input">
                    <label for="comuna">Seleccione una comuna</label>
                    <select id="comuna" name="comuna"  required>
                        <option value="">--Selecciona Comuna--</option>
                    </select>
                </div>
                <br>
                <div id="sector-input" class="grupo-input">
                    <label for="sector">Sector</label>
                    <input id="sector" name="sector" type="text" maxlength="100">
                </div>  
            </fieldset>
            <fieldset>
                <legend>¿Quien organiza?</legend>
                <div id="nombre-input" class="grupo-input">
                    <label>Nombre</label>
                    <input id="nombre" name="nombre" type="text" maxlength="200" required>
                </div>
                <br>
                <div id="mail-input" class="grupo-input">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" maxlength="100" required>
                </div>
                <br>
                <div id="numero-input" class="grupo-input">
                    <label for="numero">Número de celualar</label>
                    <input id="numero" name="numero" type="tel" maxlength="100">
                </div>
                <br>
                <div id="contactos">
                    <label for="contacto">Contactar por: </label><br>
                    <div class="contacto">
                        <input type="checkbox" name="whatsapp" onclick="revisaCheck(this);"> 
                        <label >WhatsApp</label>
                        <input id="whatsapp-id" type="text" name="whatsapp" style="display:none;" minlength="4" maxlength="50"><br>
                    </div>
                    <div class="contacto">
                        <input type="checkbox" name="instagram" onclick="revisaCheck(this);">
                        <label>Instagram</label>
                        <input id="instagram-id" type="text" name="instagram" style="display:none;" minlength="4" maxlength="50"><br>
                    </div>
                    <div class="contacto">
                        <input type="checkbox" name="tiktok" onclick="revisaCheck(this);"> 
                        <label>TikTok</label>
                        <input id="tiktok-id" type="text" name="tiktok" style="display:none;" minlength="4" maxlength="50"><br>
                    </div>
                    <div class="contacto">
                        <input type="checkbox" name="telegram" onclick="revisaCheck(this);"> 
                        <label>Telegram</label>
                        <input id="telegram-id" type="text" name="telegram" style="display:none;" minlength="4" maxlength="50"><br>
                    </div>
                    <div class="contacto">
                        <input type="checkbox" name="x" onclick="revisaCheck(this);"> 
                        <label>X</label>
                        <input id="x-id" type="text" name="x" style="display:none;" minlength="4" maxlength="50"><br>
                    </div>
                    <div class="contacto">
                        <input type="checkbox" name="otro" onclick="revisaCheck(this);">
                        <label>Otro</label>
                        <input id="otro-id" type="text" name="otro" style="display:none;" minlength="4" maxlength="50"><br>
                    </div>
                </div>
                <br>
                
            </fieldset>
            <fieldset>
                <legend>¿Cuándo y de qué trata?</legend>
                <div id="fecha-hora-inicio-input" class="grupo-input">
                    <label for="fechayhorai">Fecha y hora de inicio</label>
                    <input id="fechayhorai" name="fechayhorai" type="datetime-local" required>
                </div>
                <br>
                <div id="fecha-hora-final-input" class="grupo-input">
                    <label for="fechayhoraf">Fecha y hora de termino</label>
                    <input id="fechayhoraf" name="fechayhoraf" type="datetime-local">
                </div>
                <br>
                <div id="descripcion-input" class="descripcion">
                    <label for="descripcion">Descripción:</label>
                    <textarea name="descripcion" id="descripcion-text-area" cols=50 rows=10></textarea>
                </div>
                <div id="tema" >
                    <label for="tema">Tema: </label>
                    <input type="checkbox" name="musica" onclick="revisaCheck(this);"> Música 
                    <input type="checkbox" name="deporte" onclick="revisaCheck(this);"> Deporte                    
                    <input type="checkbox" name="ciencias" onclick="revisaCheck(this);"> Ciencias                    
                    <input type="checkbox" name="religion" onclick="revisaCheck(this);"> Religión                  
                    <input type="checkbox" name="politica" onclick="revisaCheck(this);"> Política  <br>                 
                    <input type="checkbox" name="tecnologia" onclick="revisaCheck(this);"> Tecnología                   
                    <input type="checkbox" name="juegos" onclick="revisaCheck(this);"> Juegos                   
                    <input type="checkbox" name="baile" onclick="revisaCheck(this);"> Baile                   
                    <input type="checkbox" name="comida" onclick="revisaCheck(this);"> Comida
                    <input type="checkbox" name="otro-tema" onclick="mostrarInputOtro(this);"> Otro
                    <input id="otro-tema-id" type="text" name="otro-tema-input" style="display:none;" minlength="3" maxlength="15">
                </div>
                
                <br>
                <div class="grupo-input">
                    <label for="files">Fotos</label>
                    <div class="foto-input">
                        <input id="fotos1" type="file" name="foto[]" accept="image/*" required>
                    </div>
                    <div class="foto-input" style="display:none;">
                        <input id="fotos2" type="file" name="foto[]" accept="image/*">
                    </div>
                    <div class="foto-input" style="display:none;">
                        <input id="fotos3" type="file" name="foto[]" accept="image/*">
                    </div>
                    <div class="foto-input" style="display:none;">
                        <input id="fotos4" type="file" name="foto[]" accept="image/*">
                    </div>
                    <div class="foto-input" style="display:none;">
                        <input id="fotos5" type="file" name="foto[]" accept="image/*">
                    </div>
                    <button type="button" id="agregar-foto-btn" onclick="mostrarSiguienteInput()">Agregar otra foto</button>
                </div>
            </fieldset>
            <div class="boton-container">
                <button id="submit-btn" type="submit">Agregar actividad</button>
            </div>
        </form>
    </div>
    <script src="/js/select.js"></script>
    <script src="/js/informa-act.js"></script>
    
</body>
</html>
